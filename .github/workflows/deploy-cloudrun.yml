name: Build and Deploy to Cloud Run

# Deployment is handled by Cloud Run's continuous-deploy trigger on push to main.
# This workflow no longer runs automatically (it raced the trigger); it is kept
# as a manual fallback only. Secrets are configured on the dcelectric-webapi
# Cloud Run service and persist across deploys.
on:
  workflow_dispatch:

env:
  PROJECT_ID: morrisdev-203721
  REGION: us-central1
  SERVICE_NAME: dcelectric-webapi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --cpu-boost \
            --concurrency 80 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars=ASPNETCORE_ENVIRONMENT=Production \
            --set-secrets="ConnectionStrings__DefaultConnection=dcelectric-db-connection:latest,quickbase__token=dcelectric-qb-token:latest,Websupergoo__license=dcelectric-abcpdf-license:latest,openproject__apiKey=dcelectric-openproject-key:latest,/app/secrets/gcs-key.json=dcelectric-service-account-key:latest" \
            --quiet
